name: Check extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Verify generated parser is reproducible
        run: git diff --exit-code -- grammar/src
      - run: npm run check
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.node == 24
        with:
          name: mermaid-grammar-wasm
          path: grammars/mermaid.wasm
          if-no-files-found: error
